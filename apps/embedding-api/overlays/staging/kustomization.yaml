apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: embedding-api-staging

resources:
  - ../../base
  - rollout.yaml

configurations:
  - rollout-transform.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: embedding-api

configMapGenerator:
  - name: embedding-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - COLLECTION_PREFIX=docs-staging
      - MODEL_VERSION=v2

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous